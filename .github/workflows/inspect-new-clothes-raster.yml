name: Inspect new clothing raster files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-new-clothes-raster.yml
      - assets/generated/clothes-new-raster/*.webp
      - assets/generated-art.js

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Inspect images
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          for p in sorted(Path('assets/generated/clothes-new-raster').glob('*.webp')):
              im=Image.open(p).convert('RGB')
              stat=ImageStat.Stat(im)
              print(p.name, 'size=', im.size, 'mean=', stat.mean, 'var=', stat.var, 'extrema=', im.getextrema())
          PY
