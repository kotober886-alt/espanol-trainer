name: Verify answer translations

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-answer-translations.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify every built-in exercise on live site
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi
          export CHROME
          cat > verify-answers.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const site='https://kotober886-alt.github.io/espanol-trainer/';
          const hasRu=s=>/[А-Яа-яЁё]/.test(String(s||''));
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            let live=false;
            for(let i=0;i<60;i++){
              const r=await page.request.get(site+'?translationlive='+Date.now(),{headers:{'cache-control':'no-cache'}});
              const html=await r.text();
              if(r.ok() && html.includes('trainer-v13-fixes.js?v=20260917-answertranslations1')){live=true;break;}
              await new Promise(r=>setTimeout(r,4000));
            }
            if(!live) throw new Error('Answer translation runtime did not reach Pages');
            await page.goto(site+'?translationbrowser='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>typeof window.answerPairForExercise==='function',null,{timeout:30000});
            await page.waitForTimeout(1200);
            const audit=await page.evaluate(()=>{
              const items=allExercises().filter(x=>x&&!String(x.id||'').startsWith('custom_'));
              const rows=items.map(item=>{
                const p=window.answerPairForExercise(item)||{};
                return {id:item.id,type:item.type,topic:item.topic,es:p.es||'',ru:p.ru||'',q:item.q||''};
              });
              return {count:rows.length,rows};
            });
            const bad=audit.rows.filter(r=>!r.es.trim() || !hasRu(r.ru) || /^Смысл задания:|^Русский перевод для/.test(r.ru));
            const byType={}; audit.rows.forEach(r=>{byType[r.type]=(byType[r.type]||0)+1;});
            console.log('TOTAL',audit.count);
            console.log('BY_TYPE',JSON.stringify(byType));
            if(bad.length){
              console.log('BAD_COUNT',bad.length);
              bad.slice(0,200).forEach(x=>console.log('BAD',JSON.stringify(x)));
              throw new Error('Some built-in exercises do not have a real Russian translation');
            }
            const samples=[];
            for(const wanted of ['text','choice','context-choice','correct','order','dialogue','forms','match','cloze-passage','ser-estar-hay','category-sort','picture-label','audio']){
              const x=audit.rows.find(r=>r.type===wanted); if(x)samples.push(x);
            }
            samples.forEach(x=>console.log('SAMPLE',JSON.stringify(x)));
            const dom=await page.evaluate(()=>{
              const item=allExercises().find(x=>x&&x.type==='picture-label') || allExercises()[0];
              selectedTopic=item.topic||'all'; foodPhase='practice'; sessionActive=false; queue=[item]; index=0;
              if(typeof showWorkspace==='function')showWorkspace(); render();
              return {
                es:document.querySelector('#answerText .answer-es-line strong')?.textContent||'',
                ru:document.querySelector('#answerText .answer-ru-line strong')?.textContent||'',
                esLabel:document.querySelector('#answerText .answer-es-line span')?.textContent||'',
                ruLabel:document.querySelector('#answerText .answer-ru-line span')?.textContent||''
              };
            });
            console.log('DOM',JSON.stringify(dom));
            if(!dom.es || !hasRu(dom.ru) || dom.esLabel!=='Español' || dom.ruLabel!=='Перевод') throw new Error('Correct-answer DOM is not bilingual');
            console.log('ANSWER_TRANSLATIONS_LIVE_OK',audit.count);
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node verify-answers.cjs
