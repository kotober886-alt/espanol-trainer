name: Decode last animal images

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode staged WebP files
        shell: bash
        run: |
          shopt -s nullglob
          files=(assets/picture-labels/animals/*.webp.b64tmp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No staged animal images"
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64tmp}"
            base64 -d "$f" > "$out"
            rm "$f"
          done
          python - <<'PY'
          from pathlib import Path
          expected={'lizard':4302,'frog':4690,'salamander':4198,'tortoise':4260}
          for name,size in expected.items():
              p=Path('assets/picture-labels/animals')/(name+'.webp')
              b=p.read_bytes()
              assert len(b)==size, (name,len(b),size)
              assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', name
              print(name, len(b))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/animals
          git commit -m "Add final approved animal images"
          git push
