name: Decode last animal images

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode staged WebP files
        shell: bash
        run: |
          shopt -s nullglob
          files=(assets/generated/animals/*.webp.b64tmp)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No staged animal images"
            exit 0
          fi
          for f in "${files[@]}"; do
            out="${f%.b64tmp}"
            base64 -d "$f" > "$out"
            rm "$f"
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names=['lizard','frog','salamander','tortoise']
          for name in names:
              p=Path('assets/generated/animals')/(name+'.webp')
              with Image.open(p) as im:
                  im.verify()
              print(name, p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/animals
          git commit -m "Add final approved animal images"
          git push
