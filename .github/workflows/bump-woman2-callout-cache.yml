name: Bump woman outfit callout cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-woman2-callout-cache.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump trainer cache in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='assets/trainer-v13-fixes.js?v=20260917-calloutfix1'
          if new not in s:
              s2,n=re.subn(r'assets/trainer-v13-fixes\.js\?v=[^"\']+',new,s,count=1)
              if n!=1:
                  raise SystemExit('trainer cache key not found')
              p.write_text(s2,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish woman outfit callout fix"
          git push
