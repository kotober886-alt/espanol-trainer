name: Build clean clothes extra sprite

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_clean_clothes_extra_sprite.py
      - .github/workflows/build-clean-clothes-extra-sprite.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Build clean 6x3 sprite and update runtime config
        run: python scripts/generate_clean_clothes_extra_sprite.py
      - name: Verify clean sprite and runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          p = Path("assets/picture-labels/study-clothes-extra-v2.webp")
          im = Image.open(p)
          im.load()
          assert im.size == (3072, 1536), im.size

          js = Path("assets/sprite-art.js").read_text(encoding="utf-8")
          assert "study-clothes-extra-v2.webp" in js
          assert '["clothesExtra","clothesExtra",id,6,3]' in js
          assert "CLOTHES_EXTRA_IMAGES" not in js
          assert "clothesExtraArt" not in js

          print("sprite", im.size, p.stat().st_size)
          print("runtime config OK")
          PY
      - name: Commit generated sprite and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/study-clothes-extra-v2.webp assets/sprite-art.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Generate clean clothes extra sprite v2"
          git push origin HEAD:main
