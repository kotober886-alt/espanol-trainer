name: Fix clothing picture loader

on:
  push:
    paths:
      - '.github/workflows/fix-clothing-picture-load.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate legacy script loads and bust cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="assets/visual-coverage.js?v=20260917-smallaccessory1"></script>','<script src="assets/visual-coverage.js?v=20260917-clothesapproved2"></script>')
          s=s.replace('<script src="assets/trainer-v13-fixes.js?v=20260917-smallaccessory1"></script>','<script src="assets/trainer-v13-fixes.js?v=20260917-clothesapproved2"></script>')
          s=s.replace('<script src="assets/visual-coverage.js?v=13"></script>\n','')
          s=s.replace('<script src="assets/exercise-quality-fixes.js?v=13"></script>\n','')
          s=s.replace('<script src="assets/trainer-v13-fixes.js?v=13"></script>\n','')
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix clothing picture script loading"
          git push
