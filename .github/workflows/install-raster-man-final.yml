name: Install approved raster man callouts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/install-raster-man-final.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          # The approved clothes_man.webp already contains the raster numbers + arrows.
          # Remove DOM/SVG callouts only for that scene so they are not drawn twice.
          p=Path('assets/outfit-picture-callouts.js')
          s=p.read_text(encoding='utf-8')
          needle="""    if(!labels.length) return;\n\n    visual.classList.add('outfit-callout-visual');"""
          replacement="""    if(!labels.length) return;\n\n    if(item.pictureScene==='clothes_man'){\n      visual.classList.remove('outfit-callout-visual');\n      visual.querySelectorAll('.picture-marker,.outfit-callout-svg').forEach(function(node){ node.remove(); });\n      return;\n    }\n\n    visual.classList.add('outfit-callout-visual');"""
          if needle not in s:
              raise SystemExit('outfit callout insertion point not found')
          s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')

          # Force browsers to fetch the updated callout runtime.
          p=Path('assets/trainer-v13-fixes.js')
          s=p.read_text(encoding='utf-8')
          old="assets/outfit-picture-callouts.js?v=20260917-callouts5"
          new="assets/outfit-picture-callouts.js?v=20260917-rasterman1"
          if old not in s:
              raise SystemExit('old outfit runtime cache key not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Keep one trainer patch loader, bump its cache key, and cache-bust the replaced raster.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_asset='function pictureAsset(scene){return "assets/picture-labels/"+scene+".webp";}'
          new_asset='function pictureAsset(scene){return "assets/picture-labels/"+scene+".webp"+(scene==="clothes_man"?"?v=20260917-rasterman1":"");}'
          if old_asset not in s:
              raise SystemExit('pictureAsset function not found')
          s=s.replace(old_asset,new_asset,1)
          lines=s.splitlines()
          out=[]
          loader_written=False
          for line in lines:
              if 'assets/trainer-v13-fixes.js?v=' in line:
                  if not loader_written:
                      out.append('  <script src="assets/trainer-v13-fixes.js?v=20260917-rasterman1"></script>')
                      loader_written=True
                  continue
              out.append(line)
          if not loader_written:
              raise SystemExit('trainer loader not found')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/preview-raster-outfit.yml
          rm -f .github/workflows/install-raster-man-final.yml
          git add -A
          git commit -m "Publish approved raster man outfit callouts"
          git pull --rebase origin main
          git push origin main
