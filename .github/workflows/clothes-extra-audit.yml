name: Rebuild Clothes Extra

on:
  push:
    paths:
      - '.github/workflows/clothes-extra-audit.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and numpy
        run: python -m pip install pillow numpy
      - name: Rebuild 18 individual assets from clean v1 sprite
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageChops
          import numpy as np
          from pathlib import Path
          from collections import deque

          src_path=Path('assets/picture-labels/study-clothes-extra-v1.webp')
          out_dir=Path('assets/picture-labels/clothes-extra')
          out_dir.mkdir(parents=True, exist_ok=True)
          src=Image.open(src_path).convert('RGB')
          a=np.array(src)
          mask=(a.min(axis=2)<245).astype(np.uint8)
          h,w=mask.shape

          # 8-connected components without OpenCV dependency.
          seen=np.zeros_like(mask,dtype=np.uint8)
          comps=[]
          for y in range(h):
              for x in range(w):
                  if not mask[y,x] or seen[y,x]:
                      continue
                  q=[(x,y)]; seen[y,x]=1
                  minx=maxx=x; miny=maxy=y; area=0; sx=0; sy=0
                  for qx,qy in q:
                      area+=1; sx+=qx; sy+=qy
                      minx=min(minx,qx); maxx=max(maxx,qx)
                      miny=min(miny,qy); maxy=max(maxy,qy)
                      for ny in (qy-1,qy,qy+1):
                          if ny<0 or ny>=h: continue
                          for nx in (qx-1,qx,qx+1):
                              if nx<0 or nx>=w or (nx==qx and ny==qy): continue
                              if mask[ny,nx] and not seen[ny,nx]:
                                  seen[ny,nx]=1
                                  q.append((nx,ny))
                  if area>=1000:
                      comps.append({
                        'bbox':(minx,miny,maxx+1,maxy+1),
                        'area':area,
                        'cx':sx/area,'cy':sy/area
                      })

          # v1 layout is visually a 6x3 arrangement, but not an exact raster grid.
          # These x zones separate the real objects; earrings and brooch each contain two components.
          xcuts=[0,300,600,880,1120,1420,w+1]
          row_names=[
            ['ankleboots','heels','slippers','umbrella','handkerchief','necklace'],
            ['bracelet','ring','earrings','watch','brooch','chain'],
            ['beret','handbag','wallet','coinpurse','suitcase','waistbag']
          ]
          groups={name:[] for row in row_names for name in row}

          for c in comps:
              cy=c['cy']
              row=0 if cy<300 else (1 if cy<520 else 2)
              cx=c['cx']
              col=None
              for j in range(6):
                  if xcuts[j] <= cx < xcuts[j+1]:
                      col=j; break
              if col is None:
                  raise RuntimeError(f'Unassigned component {c}')
              groups[row_names[row][col]].append(c)

          missing=[k for k,v in groups.items() if not v]
          if missing:
              raise RuntimeError(f'Missing object groups: {missing}')
          if len(groups['earrings'])!=2 or len(groups['brooch'])!=2:
              raise RuntimeError(f'Expected earrings/brooch pairs, got {len(groups["earrings"])} and {len(groups["brooch"])}')

          target_max=370
          report=[]
          thumbs=[]

          for row in row_names:
              for name in row:
                  gs=groups[name]
                  l=min(c['bbox'][0] for c in gs); t=min(c['bbox'][1] for c in gs)
                  r=max(c['bbox'][2] for c in gs); b=max(c['bbox'][3] for c in gs)
                  pad=10
                  l=max(0,l-pad); t=max(0,t-pad); r=min(w,r+pad); b=min(h,b+pad)
                  obj=src.crop((l,t,r,b))

                  ow,oh=obj.size
                  scale=min(target_max/ow,target_max/oh)
                  nw=max(1,round(ow*scale)); nh=max(1,round(oh*scale))
                  obj=obj.resize((nw,nh),Image.Resampling.LANCZOS)

                  canvas=Image.new('RGB',(512,512),'white')
                  x=(512-nw)//2; y=(512-nh)//2
                  canvas.paste(obj,(x,y))
                  out=out_dir/f'{name}.webp'
                  canvas.save(out,'WEBP',quality=96,method=6)

                  # QA on final content.
                  q=Image.open(out).convert('RGB')
                  bg=Image.new('RGB',q.size,'white')
                  diff=ImageChops.difference(q,bg).convert('L')
                  qb=diff.point(lambda p:255 if p>7 else 0).getbbox()
                  if not qb:
                      raise RuntimeError(f'{name}: empty output')
                  air=(qb[0],qb[1],512-qb[2],512-qb[3])
                  if min(air)<55:
                      raise RuntimeError(f'{name}: insufficient air {air}, bbox={qb}')
                  report.append((name,qb,air,len(gs)))

                  preview=Image.new('RGB',(540,570),'white')
                  preview.paste(q,(14,14))
                  d=ImageDraw.Draw(preview)
                  d.rectangle((13,13,526,526),outline='gray',width=1)
                  d.text((14,540),f'{name}.webp bbox={qb} air={air} comps={len(gs)}',fill='black')
                  thumbs.append(preview)

          sheet=Image.new('RGB',(4*540,5*570),(235,235,235))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%4)*540,(i//4)*570))
          sheet.save('clothes-extra-rebuilt-contact-sheet.jpg',quality=95)

          print('REBUILT',len(report),'FILES FROM',len(comps),'SOURCE COMPONENTS')
          for item in report: print(item)
          PY
      - name: Commit rebuilt assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/clothes-extra/*.webp
          git commit -m "Fix clothes extra crops from clean source components"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: clothes-extra-rebuilt-contact-sheet
          path: clothes-extra-rebuilt-contact-sheet.jpg
