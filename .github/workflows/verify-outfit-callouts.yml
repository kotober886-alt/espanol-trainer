name: Verify outfit callouts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-outfit-callouts.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify live mobile outfit callouts
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi
          export CHROME
          cat > verify-outfits.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const site='https://kotober886-alt.github.io/espanol-trainer/';
          const scenes=['clothes_man','clothes_man_3','clothes_woman_3'];
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2});
            let live=false;
            for(let i=0;i<40;i++){
              const r=await page.request.get(site+'?outfitlive='+Date.now(),{headers:{'cache-control':'no-cache'}});
              const html=await r.text();
              if(r.ok() && html.includes('trainer-v13-fixes.js?v=20260917-outfitcallouts1')){live=true;break;}
              await new Promise(r=>setTimeout(r,4000));
            }
            if(!live) throw new Error('New outfit runtime did not reach Pages');
            await page.goto(site+'?outfitbrowser='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForFunction(()=>!!document.querySelector('script[data-outfit-picture-callouts]'),null,{timeout:30000});
            for(const scene of scenes){
              const result=await page.evaluate((scene)=>{
                selectedTopic='clothes';
                selectedMode='pictures';
                foodPhase='practice';
                sessionActive=true;
                if(typeof showWorkspace==='function') showWorkspace();
                queue=allExercises().filter(x=>x&&x.topic==='clothes'&&x.type==='picture-label'&&x.pictureScene===scene);
                index=0;
                if(!queue.length) return {scene,error:'missing exercise'};
                render();
                const visual=document.querySelector('#pictureStage .picture-visual');
                const markers=[...(visual?.querySelectorAll('.outfit-callout-marker')||[])];
                const lines=[...(visual?.querySelectorAll('.outfit-callout-line')||[])];
                const vr=visual?.getBoundingClientRect();
                const w=vr?.width||1;
                const positions=markers.map(m=>{
                  const r=m.getBoundingClientRect();
                  return {n:m.textContent,cx:(r.left+r.width/2-vr.left)/w*100,cy:(r.top+r.height/2-vr.top)/(vr.height||1)*100,top:m.style.top,left:m.style.left};
                });
                return {scene,count:markers.length,lines:lines.length,positions,width:vr?.width||0,height:vr?.height||0};
              },scene);
              console.log('SCENE',JSON.stringify(result));
              if(result.error) throw new Error(scene+': '+result.error);
              if(result.width<250 || result.height<250) throw new Error(scene+': picture is not visibly laid out on mobile');
              if(result.count!==5 || result.lines!==5) throw new Error(scene+': expected 5 callouts and 5 arrows');
              if(result.positions.some(p=>p.cx>15 && p.cx<85)) throw new Error(scene+': marker still overlaps central figure');
              const visual=page.locator('#pictureStage .picture-visual');
              await visual.scrollIntoViewIfNeeded();
              await visual.screenshot({path:'outfit-'+scene+'.png',timeout:15000});
            }
            console.log('OUTFIT_CALLOUTS_LIVE_OK');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node verify-outfits.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outfit-callout-screenshots
          path: outfit-*.png
          if-no-files-found: ignore
