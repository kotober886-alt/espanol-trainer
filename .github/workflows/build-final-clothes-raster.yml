name: Build final clothing rasters

on:
  push:
    branches:
      - main
    paths:
      - assets/generated/stage-clothes-final/**
      - scripts/build_final_clothes_raster.py
      - .github/workflows/build-final-clothes-raster.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build and verify raster files
        run: python scripts/build_final_clothes_raster.py
      - name: Commit final raster files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/study-clothes-final.webp assets/generated/clothes-new-final assets/generated-art.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Build verified raster art for new clothing cards"
          git push origin HEAD:main
