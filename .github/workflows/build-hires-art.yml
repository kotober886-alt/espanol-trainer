name: Build high-resolution illustrations

on:
  push:
    paths:
      - '.github/workflows/build-hires-art.yml'
      - 'scripts/build_hires_art.py'
      - 'assets/img-clothes.js'
      - 'assets/img-foods.js'
      - 'assets/img-activities.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/build_hires_art.py
      - name: Commit high-resolution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated-clothes.webp assets/generated-foods.webp assets/generated-activities.webp assets/generated-art.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build high-resolution illustration assets"
          git push
