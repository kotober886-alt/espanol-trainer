name: Extract asset manifest

on:
  push:
    paths:
      - '.github/workflows/extract-asset-manifest.yml'
      - 'scripts/extract_asset_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/extract_asset_manifest.py
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate asset manifest"
          git push
