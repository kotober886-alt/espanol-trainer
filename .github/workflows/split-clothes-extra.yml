name: Split clothes extra images

on:
  push:
    branches:
      - main
    paths:
      - scripts/split_clothes_extra.py
      - assets/picture-labels/study-clothes-extra-v1.webp
      - .github/workflows/split-clothes-extra.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Split and normalize clothes extra
        run: python scripts/split_clothes_extra.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              "ankleboots.webp","heels.webp","slippers.webp","umbrella.webp",
              "handkerchief.webp","necklace.webp","bracelet.webp","ring.webp",
              "earrings.webp","watch.webp","brooch.webp","chain.webp",
              "beret.webp","handbag.webp","wallet.webp","coinpurse.webp",
              "suitcase.webp","waistbag.webp",
          }
          root = Path("assets/picture-labels/clothes-extra")
          actual = {p.name for p in root.glob("*.webp")}
          assert actual == expected, (expected - actual, actual - expected)
          for path in sorted(root.glob("*.webp")):
              im = Image.open(path)
              im.load()
              assert im.size == (512, 512), (path, im.size)
              print(path, im.size, path.stat().st_size)
          PY
      - name: Commit normalized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/clothes-extra
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Generate normalized clothes extra images"
          git push origin HEAD:main
