name: Backpack chroma audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/cleanup_backpack_chroma.py"
      - ".github/workflows/backpack-chroma-cleanup.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Scan, clean and verify backpack assets
        run: |
          python scripts/cleanup_backpack_chroma.py \
            --root assets/images/backpack \
            --manifest data/backpack-items.js \
            --report /tmp/backpack-chroma-report.json \
            --preview-dir /tmp/backpack-chroma-previews

      - name: Upload audit report and previews
        uses: actions/upload-artifact@v4
        with:
          name: backpack-chroma-audit
          path: |
            /tmp/backpack-chroma-report.json
            /tmp/backpack-chroma-previews/
          if-no-files-found: error
          retention-days: 7

      - name: Commit cleaned assets
        run: |
          if git diff --quiet -- assets/images/backpack; then
            echo "No chroma-key asset changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/backpack
          git commit -m "fix: clean chroma from backpack assets"
          git push origin HEAD:main
