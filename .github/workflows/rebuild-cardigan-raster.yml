name: Rebuild verified cardigan raster

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rebuild-cardigan-raster.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Rebuild cardigan from staged chunks
        shell: bash
        run: |
          cat tmp/cardigan_b64_1.txt tmp/cardigan_b64_2.txt tmp/cardigan_b64_3.txt tmp/cardigan_b64_4.txt | tr -d '\n\r ' | base64 -d > assets/generated/clothes-new-raster/cardigan.webp
          test "$(git hash-object assets/generated/clothes-new-raster/cardigan.webp)" = "2570e80481092ee4c67c5f0bc8483842c94c10ea"
      - name: Validate all clothing rasters with Pillow
        run: |
          python - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          expected={'hoodie.webp','vest.webp','polo.webp','cardigan.webp'}
          ps=list(Path('assets/generated/clothes-new-raster').glob('*.webp'))
          assert {p.name for p in ps} == expected
          for p in sorted(ps):
              im=Image.open(p).convert('RGB')
              im.load()
              st=ImageStat.Stat(im)
              assert im.width >= 400 and im.height >= 400, (p, im.size)
              assert max(st.var) > 100, (p, st.var)
              print(p.name, im.size, st.mean, st.var)
          PY
      - name: Commit verified cardigan and remove staging chunks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/clothes-new-raster/cardigan.webp
          git rm tmp/cardigan_b64_1.txt tmp/cardigan_b64_2.txt tmp/cardigan_b64_3.txt tmp/cardigan_b64_4.txt
          git commit -m "Rebuild verified cardigan raster"
          git push origin HEAD:main
