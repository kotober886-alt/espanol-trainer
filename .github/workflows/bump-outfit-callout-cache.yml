name: Patch remaining answer translations

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-outfit-callout-cache.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing translations and bump cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/answer-translations.js')
          s = p.read_text(encoding='utf-8')
          anchor = "  const SENTENCE_RU={\n"
          additions = "\n".join([
              "    p2:'lee / usted lee — Вы читаете / Вы читаете (usted).',",
              "    p3:'no escucháis / vosotros no escucháis / no escucháis vosotros — вы не слушаете.',",
              "    ct9:'pequeño / pequeña — маленький / маленькая.',",
              "    ct10:'feo / fea — некрасивый / некрасивая.',",
              "    ct11:'caro / cara — дорогой / дорогая.',",
              "    ct12:'sucio / sucia — грязный / грязная.',",
              "    ct13:'ruidoso / ruidosa — шумный / шумная.',",
              "    ct14:'desagradable — неприятный / неприятная.',",
              ""
          ])
          if "    p2:'lee / usted lee" not in s:
              if anchor not in s:
                  raise SystemExit('SENTENCE_RU anchor not found')
              p.write_text(s.replace(anchor, anchor + additions, 1), encoding='utf-8')

          trainer = Path('assets/trainer-v13-fixes.js')
          s = trainer.read_text(encoding='utf-8')
          old = 'assets/answer-translations.js?v=20260917-answertranslations1'
          new = 'assets/answer-translations.js?v=20260917-answertranslations2'
          if new not in s:
              if old not in s:
                  raise SystemExit('Answer translation child cache key not found')
              trainer.write_text(s.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = 'assets/trainer-v13-fixes.js?v=20260917-answertranslations1'
          new = 'assets/trainer-v13-fixes.js?v=20260917-answertranslations2'
          if new not in s:
              if old not in s:
                  raise SystemExit('Trainer cache key not found')
              index.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/answer-translations.js assets/trainer-v13-fixes.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete Russian translations for correct answers"
          git push
