name: Install answer translation runtime

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-outfit-callout-cache.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install answer translation layer and bump cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          trainer = Path('assets/trainer-v13-fixes.js')
          s = trainer.read_text(encoding='utf-8')
          marker = "  function loadOutfitPictureCallouts(){"
          loader = "\n".join([
              "  function loadAnswerTranslations(){",
              "    const old=document.querySelector('script[data-answer-translations]');",
              "    if(old) old.remove();",
              "    const script=document.createElement('script');",
              "    script.src='assets/answer-translations.js?v=20260917-answertranslations1';",
              "    script.dataset.answerTranslations='1';",
              "    document.body.appendChild(script);",
              "  }",
              "  loadAnswerTranslations();",
              "",
              ""
          ])
          if "data-answer-translations" not in s:
              if marker not in s:
                  raise SystemExit('Expected trainer insertion marker not found')
              trainer.write_text(s.replace(marker, loader + marker, 1), encoding='utf-8')
          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old = 'assets/trainer-v13-fixes.js?v=20260917-outfitcallouts2'
          new = 'assets/trainer-v13-fixes.js?v=20260917-answertranslations1'
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected trainer cache key not found')
              index.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/trainer-v13-fixes.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enable Russian translations in correct answers"
          git push
