name: Bump outfit callout cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-outfit-callout-cache.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump trainer cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='assets/trainer-v13-fixes.js?v=20260917-individual2'
          new='assets/trainer-v13-fixes.js?v=20260917-outfitcallouts1'
          if new in s:
              print('Cache key already updated')
          elif old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('Updated cache key')
          else:
              raise SystemExit('Expected trainer cache key not found')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump cache for outfit callout layout"
          git push
