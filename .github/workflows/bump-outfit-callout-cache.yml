name: Bump refined translation cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-outfit-callout-cache.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump trainer cache key
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); old='assets/trainer-v13-fixes.js?v=20260917-answertranslations2'; new='assets/trainer-v13-fixes.js?v=20260917-answertranslations3'; assert new in s or old in s, 'cache key not found'; p.write_text(s if new in s else s.replace(old,new,1),encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump cache for refined answer translations"
          git push
