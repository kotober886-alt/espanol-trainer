name: Bump outfit callout cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bump-outfit-callout-cache.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump refined outfit callout cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          trainer=Path('assets/trainer-v13-fixes.js')
          s=trainer.read_text(encoding='utf-8')
          old="assets/outfit-picture-callouts.js?v=20260917-callouts1"
          new="assets/outfit-picture-callouts.js?v=20260917-callouts2"
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected outfit callout loader key not found')
              trainer.write_text(s.replace(old,new,1),encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          old="assets/trainer-v13-fixes.js?v=20260917-outfitcallouts1"
          new="assets/trainer-v13-fixes.js?v=20260917-outfitcallouts2"
          if new not in s:
              if old not in s:
                  raise SystemExit('Expected trainer cache key not found')
              index.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/trainer-v13-fixes.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump refined outfit callout cache keys"
          git push
