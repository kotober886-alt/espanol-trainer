name: Rebuild clothes extra to project sprite standard

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_clean_clothes_extra_sprite.py
      - .github/workflows/rebuild-clothes-extra-standard.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Rebuild clothesExtra in 360px-cell standard
        run: python scripts/generate_clean_clothes_extra_sprite.py
      - name: Verify exact sprite standard and runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          sprite = Path("assets/picture-labels/study-clothes-extra-v2.webp")
          im = Image.open(sprite)
          im.load()
          assert im.size == (2160, 1080), im.size

          js = Path("assets/sprite-art.js").read_text(encoding="utf-8")
          assert "study-clothes-extra-v2.webp" in js
          assert '["clothesExtra","clothesExtra",id,6,3]' in js
          assert "clothesExtra:{ankleboots:[0,0]" in js
          assert "CLOTHES_EXTRA_IMAGES" not in js
          assert "clothesExtraArt" not in js

          print("sprite", im.size, "cell=360x360", sprite.stat().st_size)
          print("runtime config OK")
          PY
      - name: Commit rebuilt standard sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/study-clothes-extra-v2.webp assets/sprite-art.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild clothes extra in 360px sprite standard"
          git push origin HEAD:main
