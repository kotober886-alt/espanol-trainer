name: Apply outfit callout cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-outfit-labels.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump callout cache and remove duplicate trainer loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          trainer=Path('assets/trainer-v13-fixes.js')
          s=trainer.read_text(encoding='utf-8')
          s=s.replace('assets/outfit-picture-callouts.js?v=20260917-callouts3','assets/outfit-picture-callouts.js?v=20260917-callouts4')
          trainer.write_text(s,encoding='utf-8')

          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          old='  <script src="assets/trainer-v13-fixes.js?v=20260917-answertranslations3"></script>\n<script src="assets/trainer-v13-fixes.js?v=13"></script>'
          new='  <script src="assets/trainer-v13-fixes.js?v=20260917-outfitcallouts4"></script>'
          if old in s:
              s=s.replace(old,new,1)
          else:
              s=s.replace('assets/trainer-v13-fixes.js?v=20260917-answertranslations3','assets/trainer-v13-fixes.js?v=20260917-outfitcallouts4')
              s=s.replace('\n<script src="assets/trainer-v13-fixes.js?v=13"></script>','',1)
          index.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trainer-v13-fixes.js index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish unambiguous outfit callout targets"
          git push
