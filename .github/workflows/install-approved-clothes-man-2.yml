name: Install approved clothes_man_2

on:
  push:
    paths:
      - '.github/workflows/install-approved-clothes-man-2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved clothes_man_2
        run: |
          cat assets/picture-labels/.upload-clothes-man-2/part*.txt > /tmp/clothes_man_2.b64
          base64 -d /tmp/clothes_man_2.b64 > /tmp/clothes_man_2.webp
          test "$(wc -c < /tmp/clothes_man_2.webp)" = "37784"
          echo "9e375668c35b330daa14e3598778953330c1827d4d2fd08c5f91bbc0f547b872  /tmp/clothes_man_2.webp" | sha256sum -c -
          cp /tmp/clothes_man_2.webp assets/picture-labels/clothes_man_2.webp
      - name: Commit approved image and clean temp files
        run: |
          rm -rf assets/picture-labels/.upload-clothes-man-2
          rm -f .github/workflows/install-approved-clothes-man-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace clothes_man_2 with approved image"
          git push
