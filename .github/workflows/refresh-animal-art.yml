name: Пересобрать картинки животных

on:
  push:
    paths:
      - ".github/workflows/refresh-animal-art.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Установить Pillow
        run: python -m pip install --quiet pillow

      - name: Собрать новый растровый спрайт животных
        run: python scripts/build_animal_sprite_v3.py

      - name: Переключить тренажёр на новый спрайт
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assets/animals-topic.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/generated/study-animals-v1.webp', 'assets/generated/study-animals-v3.webp')
          p.write_text(s, encoding='utf-8')

          p = Path('assets/animals-card-art-fix.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const SRC='[^']+';", "const SRC='./assets/generated/study-animals-v3.webp?v=1';", s, count=1)
          s = re.sub(r"const FALLBACK='[^']+';", "const FALLBACK='./assets/generated/study-animals-v3.webp?v=1';", s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('assets/trainer-v13-fixes.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/animals-card-art-fix.js?v=2', 'assets/animals-card-art-fix.js?v=3')
          s = s.replace('assets/animals-topic.js?v=5', 'assets/animals-topic.js?v=6')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/trainer-v13-fixes.js?v=20260917animals1', 'assets/trainer-v13-fixes.js?v=20260917animals2')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Проверить, что WebP реально декодируется
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/generated/study-animals-v3.webp'
          im=Image.open(p)
          im.load()
          assert im.size == (1350,600), im.size
          assert im.getbbox() is not None
          print('OK', im.format, im.size)
          PY

      - name: Сохранить новый спрайт и подключения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/study-animals-v3.webp assets/animals-topic.js assets/animals-card-art-fix.js assets/trainer-v13-fixes.js index.html
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Rebuild working animal raster artwork"
          git push origin HEAD:main
