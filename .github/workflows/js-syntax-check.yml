name: JavaScript syntax check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check critical JavaScript files
        run: |
          node --check js/ui/app.js
          node --check js/ui/navigation.js
          node --check js/modes/cat-album.js
          node --check js/modes/conjugation.js
          node --check js/modes/verb-wheel.js
      - name: Check all JavaScript files
        run: |
          find js data -type f -name '*.js' -print0 | xargs -0 -n1 node --check
