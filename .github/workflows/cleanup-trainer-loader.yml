name: Cleanup duplicate trainer loader

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-trainer-loader.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate trainer loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          duplicate='<script src="assets/trainer-v13-fixes.js?v=13"></script>\n'
          if duplicate not in s:
              raise SystemExit('legacy duplicate loader not found')
          s=s.replace(duplicate,'',1)
          if s.count('trainer-v13-fixes.js?v=') != 1:
              raise SystemExit('trainer loader count is not 1 after cleanup')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/cleanup-trainer-loader.yml
          git add -A
          git commit -m "Remove duplicate trainer patch loader"
          git pull --rebase origin main
          git push origin main
