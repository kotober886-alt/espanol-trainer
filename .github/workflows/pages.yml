name: Опубликовать тренажёр

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы
        uses: actions/checkout@v5

      - name: Проверить сайт
        shell: bash
        run: |
          test -f index.html
          test -f css/base.css
          test -f js/ui/app.js
          test -f build-version.txt

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Подготовить сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
