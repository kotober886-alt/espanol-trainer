name: Rebuild clothes extra images

on:
  push:
    branches:
      - main
    paths:
      - scripts/split_clothes_extra.py
      - .github/workflows/rebuild-clothes-extra.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install Pillow
      - name: Rebuild single-item images
        run: python scripts/split_clothes_extra.py
      - name: Verify generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("assets/picture-labels/clothes-extra")
          files = sorted(root.glob("*.webp"))
          assert len(files) == 18, len(files)

          for path in files:
              im = Image.open(path)
              im.load()
              assert im.size == (512, 512), (path, im.size)
              print(path.name, im.size, path.stat().st_size)
          PY
      - name: Commit corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/clothes-extra
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild clothes extra as single-item images"
          git push origin HEAD:main
