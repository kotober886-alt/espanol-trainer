name: Install approved clothes_man

on:
  push:
    paths:
      - '.github/workflows/install-approved-clothes-man.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved clothes_man
        run: |
          cat assets/picture-labels/.upload-clothes-man/part*.txt > /tmp/clothes_man.b64
          base64 -d /tmp/clothes_man.b64 > /tmp/clothes_man.webp
          test "$(wc -c < /tmp/clothes_man.webp)" = "19730"
          echo "b01348808be6886e5d4ffd7974c44daf58040bdbc0535ae1e22777828bd05180  /tmp/clothes_man.webp" | sha256sum -c -
          cp /tmp/clothes_man.webp assets/picture-labels/clothes_man.webp
      - name: Commit approved image and clean temp files
        run: |
          rm -rf assets/picture-labels/.upload-clothes-man
          rm -f .github/workflows/install-approved-clothes-man.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/picture-labels/clothes_man.webp assets/picture-labels/.upload-clothes-man .github/workflows/install-approved-clothes-man.yml
          git commit -m "Replace clothes_man with approved image"
          git push
