name: Publish approved animal illustrations

on:
  push:
    paths:
      - '.publish-approved-animal-art'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip marker-deletion rerun
        id: marker
        shell: bash
        run: |
          if [ -f .publish-approved-animal-art ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble exact approved raster atlas
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/generated -maxdepth 1 -name '.animal-approved.part*' | wc -l)" -eq 9
          cat $(find assets/generated -maxdepth 1 -name '.animal-approved.part*' | sort) > /tmp/animals-approved.b64
          base64 -d /tmp/animals-approved.b64 > assets/generated/animals-approved-v1.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/generated/animals-approved-v1.webp')
          d=p.read_bytes()
          assert d[:4] == b'RIFF' and d[8:12] == b'WEBP', 'decoded file is not WebP'
          assert len(d) > 80000, 'decoded atlas unexpectedly small'
          print('approved atlas bytes:', len(d))
          PY

      - name: Install approved animal card renderer
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          cat > assets/animals-approved-art.js <<'EOF'
          (function(){
            'use strict';
            const SRC='assets/generated/animals-approved-v1.webp?v=20260917-approved1';
            const POS={
              dog:[0,0],cat:[1,0],rabbit:[2,0],hamster:[3,0],mouse:[4,0],turtle:[5,0],
              horse:[0,1],cow:[1,1],pig:[2,1],sheep:[3,1],goat:[4,1],chicken:[5,1],
              lion:[0,2],tiger:[1,2],bear:[2,2],elephant:[3,2],giraffe:[4,2],monkey:[5,2],
              eagle:[0,3],owl:[1,3],parrot:[2,3],duck:[3,3],penguin:[4,3],flamingo:[5,3],
              fish:[0,4],shark:[1,4],dolphin:[2,4],whale:[3,4],octopus:[4,4],crab:[5,4],
              snake:[0,5],crocodile:[1,5],lizard:[2,5],frog:[3,5],salamander:[4,5],tortoise:[5,5]
            };

            function approvedAnimalArt(key){
              const p=POS[key];
              if(!p) return '';
              const x=p[0]*20, y=p[1]*20;
              return '<div class="approved-animal-art" aria-hidden="true" style="background-image:url(\''+SRC+'\');background-position:'+x+'% '+y+'%;"></div>';
            }

            const style=document.createElement('style');
            style.textContent='\n.approved-animal-art{display:block!important;width:min(260px,92%)!important;aspect-ratio:1/1!important;margin:auto!important;border-radius:18px!important;background-color:#fffdf8!important;background-repeat:no-repeat!important;background-size:600% 600%!important}.food-art .approved-animal-art{width:min(260px,92%)!important}.visual-single-art .approved-animal-art{width:min(230px,76%)!important}@media(max-width:520px){.food-art .approved-animal-art{width:min(205px,90%)!important}.visual-single-art .approved-animal-art{width:min(170px,72%)!important}}\n';
            document.head.appendChild(style);

            function install(){
              try{ window.animalArt=approvedAnimalArt; }catch(e){}

              try{
                if(typeof studyArt==='function' && !studyArt.__approvedAnimalArt){
                  const baseStudyArt=studyArt;
                  const patchedStudyArt=function(word){
                    try{ if(selectedTopic==='animals' && word) return approvedAnimalArt(word.art || word.id); }catch(e){}
                    return baseStudyArt(word);
                  };
                  patchedStudyArt.__approvedAnimalArt=true;
                  studyArt=patchedStudyArt;
                }
              }catch(e){}

              try{
                if(typeof allExercises==='function' && !allExercises.__approvedAnimalArt){
                  const baseAll=allExercises;
                  const patchedAll=function(){
                    return baseAll().map(function(item){
                      if(item && item.topic==='animals' && item.type==='picture-label'){
                        const id=String(item.id||'').replace(/^visual_animals_/, '');
                        if(POS[id]) item.pictureHtml=approvedAnimalArt(id);
                      }
                      return item;
                    });
                  };
                  patchedAll.__approvedAnimalArt=true;
                  allExercises=patchedAll;
                }
              }catch(e){}

              try{
                if(typeof renderStudy==='function' && !renderStudy.__approvedAnimalArt){
                  const baseRender=renderStudy;
                  const patchedRender=function(){
                    baseRender();
                    try{
                      if(selectedTopic==='animals'){
                        const words=currentFoodWords();
                        const word=words[wordIndex];
                        els.studyCard.classList.remove('no-art');
                        els.foodArt.style.display='grid';
                        if(word) els.foodArt.innerHTML=approvedAnimalArt(word.art || word.id);
                      }
                    }catch(e){}
                  };
                  patchedRender.__approvedAnimalArt=true;
                  renderStudy=patchedRender;
                }
              }catch(e){}

              try{
                if(selectedTopic==='animals' && foodPhase==='study' && typeof renderStudy==='function') renderStudy();
              }catch(e){}
            }

            let n=0;
            const timer=setInterval(function(){
              n++;
              install();
              if(n>=40) clearInterval(timer);
            },250);
            document.addEventListener('DOMContentLoaded',install);
            window.addEventListener('load',function(){install();setTimeout(install,300);setTimeout(install,1200);});
            install();
          })();
          EOF

      - name: Load approved renderer last and remove duplicate trainer loader
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          lines=[]
          for line in text.splitlines():
              if 'assets/trainer-v13-fixes.js' in line:
                  continue
              if 'assets/animals-approved-art.js' in line:
                  continue
              lines.append(line)
          text='\n'.join(lines)
          insert='  <script src="assets/trainer-v13-fixes.js?v=20260917animals5"></script>\n  <script src="assets/animals-approved-art.js?v=20260917-approved1"></script>\n'
          text=text.replace('</body>',insert+'</body>')
          p.write_text(text+'\n',encoding='utf-8')
          PY

      - name: Remove temporary chunks and publish
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          rm -f assets/generated/.animal-approved.part* .publish-approved-animal-art
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish approved raster animal illustrations"
          git push
