name: Upscale animal illustrations once

on:
  push:
    paths:
      - '.github/workflows/upscale-animal-images-once.yml'

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Upscale and restore all individual animal images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance

          expected = [
              'dog','cat','rabbit','hamster','mouse','turtle',
              'horse','cow','pig','sheep','goat','chicken',
              'lion','tiger','bear','elephant','giraffe','monkey',
              'eagle','owl','parrot','duck','penguin','flamingo',
              'fish','shark','dolphin','whale','octopus','crab',
              'snake','crocodile','lizard','frog','salamander','tortoise'
          ]
          root = Path('assets/generated/animals')
          files = {p.stem: p for p in root.glob('*.webp')}
          assert set(files) == set(expected), (len(files), sorted(set(expected)-set(files)), sorted(set(files)-set(expected)))

          for key in expected:
              path = files[key]
              with Image.open(path) as src:
                  src.load()
                  mode = 'RGBA' if 'A' in src.mode else 'RGB'
                  im = src.convert(mode)
                  w, h = im.size

                  # Remove the harshest tiny compression blocks without softening edges.
                  rgb = im.convert('RGB')
                  rgb = rgb.filter(ImageFilter.GaussianBlur(radius=0.22))

                  # High-quality 4× reconstruction, with a 1024px minimum for retina/mobile screens.
                  scale = max(4.0, 1024 / max(w, 1), 1024 / max(h, 1))
                  nw, nh = int(round(w * scale)), int(round(h * scale))
                  rgb = rgb.resize((nw, nh), Image.Resampling.LANCZOS)

                  # Restore local edge definition/detail after resampling.
                  rgb = rgb.filter(ImageFilter.UnsharpMask(radius=1.25, percent=145, threshold=2))
                  rgb = ImageEnhance.Sharpness(rgb).enhance(1.08)

                  if mode == 'RGBA':
                      alpha = im.getchannel('A').resize((nw, nh), Image.Resampling.LANCZOS)
                      out = rgb.convert('RGBA')
                      out.putalpha(alpha)
                  else:
                      out = rgb

                  out.save(path, 'WEBP', lossless=True, quality=100, method=6)
                  print(f'{key}: {w}x{h} -> {nw}x{nh}; {path.stat().st_size} bytes')

          # Validate every file after re-encoding.
          for key in expected:
              path = files[key]
              with Image.open(path) as check:
                  check.load()
                  assert check.format == 'WEBP', (key, check.format)
                  assert check.width >= 1024 and check.height >= 1024, (key, check.size)
          print('Validated', len(expected), 'animal images')
          PY

      - name: Commit upgraded animal graphics
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/upscale-animal-images-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/animals .github/workflows/upscale-animal-images-once.yml
          git diff --cached --stat
          git commit -m "Upscale all animal illustrations for cards and practice"
          git push origin HEAD:main
