name: Preview raster outfit callouts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/preview-raster-outfit.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw callouts on original site asset
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math, os

          src='assets/picture-labels/clothes_man.webp'
          out='clothes_man_raster_preview.png'
          im=Image.open(src).convert('RGBA')
          w,h=im.size
          draw=ImageDraw.Draw(im)
          purple=(98,83,217,255)
          white=(255,255,255,255)
          shadow=(35,28,89,50)
          s=min(w,h)
          lw=max(2,round(s*0.0032))
          r=max(15,round(s*0.028))
          ah=max(8,round(s*0.015))
          try:
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', max(16,round(r*1.05)))
          except Exception:
              font=ImageFont.load_default()

          # label position -> exact target point, all in relative image coordinates
          callouts=[
              (1,(0.13,0.38),(0.39,0.39)),  # red jacket
              (2,(0.87,0.43),(0.505,0.405)),# striped shirt
              (3,(0.84,0.24),(0.615,0.335)),# blue backpack strap
              (4,(0.13,0.66),(0.47,0.64)),  # beige trousers
              (5,(0.86,0.87),(0.565,0.855)),# white sneakers
          ]

          def pt(p): return (round(p[0]*w), round(p[1]*h))
          def arrow(start,end):
              sx,sy=pt(start); ex,ey=pt(end)
              dx,dy=ex-sx,ey-sy
              L=max(1,math.hypot(dx,dy)); ux,uy=dx/L,dy/L
              # line starts outside the numbered circle
              ls=(round(sx+ux*(r+5)), round(sy+uy*(r+5)))
              le=(round(ex-ux*2), round(ey-uy*2))
              draw.line([ls,le], fill=purple, width=lw)
              bx,by=ex-ux*ah, ey-uy*ah
              px,py=-uy,ux
              p1=(ex,ey)
              p2=(round(bx+px*ah*0.48),round(by+py*ah*0.48))
              p3=(round(bx-px*ah*0.48),round(by-py*ah*0.48))
              draw.polygon([p1,p2,p3], fill=purple)

          for n,pos,target in callouts:
              arrow(pos,target)

          for n,pos,target in callouts:
              x,y=pt(pos)
              # soft shadow then purple circle with thin white border
              draw.ellipse([x-r+2,y-r+4,x+r+2,y+r+4], fill=shadow)
              draw.ellipse([x-r,y-r,x+r,y+r], fill=white)
              inner=max(2,round(s*0.004))
              draw.ellipse([x-r+inner,y-r+inner,x+r-inner,y+r-inner], fill=purple)
              txt=str(n)
              box=draw.textbbox((0,0),txt,font=font)
              tw,th=box[2]-box[0],box[3]-box[1]
              draw.text((x-tw/2,y-th/2-box[1]),txt,font=font,fill=white)

          im.convert('RGB').save(out,'PNG',optimize=True)
          print('SOURCE_SIZE',w,h)
          print('PREVIEW',out,os.path.getsize(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: clothes-man-raster-preview
          path: clothes_man_raster_preview.png
