name: Verify Clothes Figure Practice

on:
  push:
    paths:
      - '.github/workflows/verify-clothes-figures.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify assets and wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text(encoding='utf-8')
          expected=[
            'clothes_man.webp','clothes_man_2.webp','clothes_man_3.webp','clothes_man_4.webp','clothes_man_5.webp',
            'clothes_woman.webp','clothes_woman_2.webp','clothes_woman_3.webp','clothes_woman_4.webp','clothes_woman_5.webp'
          ]
          base=Path('assets/picture-labels')
          missing=[name for name in expected if not (base/name).exists()]
          assert not missing, f'Missing figure assets: {missing}'

          assert 'data-session-mode="outfits"' in html
          assert 'selectedMode==="outfits"' in html
          assert '/^clothes_(?:woman|man)(?:_[2-5])?$/' in html
          assert 'function clothingLabel(' in html
          assert 'String(value).toLowerCase().trim()' in html

          scenes=re.findall(r'item\("(?:(?:woman|man)_clothes(?:_[2-5])?)".*?"(clothes_(?:woman|man)(?:_[2-5])?)"',html,re.S)
          assert len(set(scenes))==10, f'Expected 10 routed clothing scenes, got {sorted(set(scenes))}'

          labels=re.findall(r'clothingLabel\([^\n]+?,"([^"]+)","([^"]+)"\)',html)
          assert len(labels)==50, f'Expected 50 dictionary-backed labels, got {len(labels)}'

          ids=set(re.findall(r'clothingWord\("([^"]+)"',html))
          bad=[card for card,color in labels if card not in ids]
          assert not bad, f'Unknown clothing card ids: {bad}'

          print('OK: 10 assets, 10 scenes, 50 dictionary-backed labels')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          inline='\n'.join(scripts)
          Path('/tmp/app-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
