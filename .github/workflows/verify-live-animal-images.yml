name: Verify live animal images

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-live-animal-images.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify published trainer in Chromium
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          export CHROME
          cat > verify-animals.cjs <<'NODE'
          const { chromium } = require('playwright-core');
          const site = 'https://kotober886-alt.github.io/espanol-trainer/';
          const keys = ['dog','cat','rabbit','hamster','mouse','turtle','horse','cow','pig','sheep','goat','chicken','lion','tiger','bear','elephant','giraffe','monkey','eagle','owl','parrot','duck','penguin','flamingo','fish','shark','dolphin','whale','octopus','crab','snake','crocodile','lizard','frog','salamander','tortoise'];

          (async()=>{
            const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME, args:['--no-sandbox']});
            const page = await browser.newPage({ viewport:{width:1280,height:900} });
            page.on('console', msg => console.log('PAGE:', msg.text()));
            page.on('pageerror', err => console.log('PAGEERROR:', err.message));

            let live = false;
            for(let i=0;i<30;i++){
              const r = await page.request.get(site+'?livecheck='+Date.now(), {headers:{'cache-control':'no-cache'}});
              const html = await r.text();
              if(r.ok() && html.includes('trainer-v13-fixes.js?v=20260917-individual2')) { live=true; break; }
              await new Promise(r=>setTimeout(r,4000));
            }
            if(!live) throw new Error('Published HTML never reached individual2 runtime');

            await page.goto(site+'?browsercheck='+Date.now(), {waitUntil:'networkidle', timeout:60000});
            await page.waitForFunction(() => typeof window.animalArt === 'function', null, {timeout:30000});

            const direct = await page.evaluate(async(keys)=>{
              const out=[];
              for(const key of keys){
                const row = await new Promise(resolve=>{
                  const img=new Image();
                  img.onload=()=>resolve({key,ok:img.naturalWidth>0&&img.naturalHeight>0,w:img.naturalWidth,h:img.naturalHeight,src:img.src});
                  img.onerror=()=>resolve({key,ok:false,w:0,h:0,src:img.src});
                  img.src='assets/generated/animals/'+key+'.webp?v=browsercheck-'+Date.now();
                });
                out.push(row);
              }
              return out;
            }, keys);
            const bad = direct.filter(x=>!x.ok);
            console.log('DIRECT_IMAGES_OK', direct.length-bad.length, '/', direct.length);
            if(bad.length) throw new Error('Broken direct animal images: '+bad.map(x=>x.key).join(','));

            await page.evaluate(()=>{
              selectedTopic='animals';
              foodPhase='study';
              foodCategory='all';
              wordIndex=0;
              renderStudy();
            });
            await page.waitForFunction(()=>{
              const img=document.querySelector('#foodArt img.approved-animal-single');
              return !!img && img.complete && img.naturalWidth>0 && img.naturalHeight>0;
            }, null, {timeout:15000});
            const study = await page.$eval('#foodArt img.approved-animal-single', img=>({src:img.src,w:img.naturalWidth,h:img.naturalHeight}));
            console.log('STUDY_IMAGE', JSON.stringify(study));
            if(!study.src.includes('/assets/generated/animals/dog.webp')) throw new Error('Study card did not use dog.webp: '+study.src);

            const diag = await page.evaluate(()=>{
              selectedTopic='animals';
              foodCategory='all';
              selectedMode='pictures';
              foodPhase='practice';
              sessionActive=true;
              queue=allExercises().filter(x=>x&&x.topic==='animals'&&x.type==='picture-label');
              index=0;
              const first=queue[0]||null;
              const before={wrapped:!!(render&&render.__approvedAnimalsPictureV5),count:queue.length,first:first?{id:first.id,topic:first.topic,type:first.type,pictureScene:first.pictureScene}:null};
              render();
              const img=document.querySelector('#pictureStage img.approved-animal-single');
              return {before,html:document.querySelector('#pictureStage')?.innerHTML||'',img:img?{src:img.src,className:img.className,complete:img.complete,w:img.naturalWidth,h:img.naturalHeight}:null};
            });
            console.log('PICTURE_DIAG', JSON.stringify(diag));
            await page.waitForFunction(()=>{
              const img=document.querySelector('#pictureStage img.approved-animal-single');
              return !!img && img.complete && img.naturalWidth>0 && img.naturalHeight>0;
            }, null, {timeout:15000});
            const picture = await page.$eval('#pictureStage img.approved-animal-single', img=>({src:img.src,w:img.naturalWidth,h:img.naturalHeight}));
            console.log('PICTURE_EXERCISE_IMAGE', JSON.stringify(picture));
            if(!picture.src.includes('/assets/generated/animals/dog.webp')) throw new Error('Picture exercise did not use dog.webp: '+picture.src);

            console.log('LIVE_ANIMAL_RENDER_VERIFY_OK');
            await browser.close();
          })().catch(err=>{ console.error(err.stack||err); process.exit(1); });
          NODE
          node verify-animals.cjs
