name: Split new clothing raster cards

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/split_new_clothes_raster.py"
      - ".github/workflows/split-new-clothes-raster.yml"

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build individual raster clothing images
        run: python scripts/split_new_clothes_raster.py
      - name: Verify raster outputs
        run: python -c "from pathlib import Path; from PIL import Image,ImageStat; ps=sorted(Path('assets/generated/clothes-new-raster').glob('*.webp')); assert len(ps)==4, ps; [(lambda im,p: (print(p,im.size), (_ for _ in ()).throw(AssertionError((p,im.size))) if min(im.size)<300 else None, (_ for _ in ()).throw(AssertionError((p,ImageStat.Stat(im).var))) if max(ImageStat.Stat(im).var)<=100 else None))(Image.open(p).convert('RGB'),p) for p in ps]"
      - name: Commit individual raster clothing art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/clothes-new-raster assets/generated-art.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Use individual generated raster clothing card art"
          git push origin HEAD:main
