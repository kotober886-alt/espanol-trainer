name: Split new clothing raster cards

on:
  push:
    branches:
      - main
    paths:
      - scripts/split_new_clothes_raster.py
      - assets/generated/new-clothes-valid.b64.txt
      - .github/workflows/split-new-clothes-raster.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Build raster clothing images
        run: python scripts/split_new_clothes_raster.py
      - name: Commit raster clothing images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/study-clothes-new-v1.webp assets/generated/clothes-new-raster assets/generated-art.js
          git rm -f assets/generated/new-clothes-valid.b64.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Use individual generated raster clothing card art"
          git push origin HEAD:main
