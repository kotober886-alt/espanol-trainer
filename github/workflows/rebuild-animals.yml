name: Rebuild Animal Assets

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild-animals

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install waifu2x-ncnn-vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/nihui/waifu2x-ncnn-vulkan/releases/download/20220728/waifu2x-ncnn-vulkan-20220728-ubuntu.zip
          unzip waifu2x-ncnn-vulkan-20220728-ubuntu.zip

      - name: Run upscale
        run: |
          mkdir -p /tmp/animals_upscaled
          ./waifu2x-ncnn-vulkan-20220728-ubuntu/waifu2x-ncnn-vulkan \
            -i assets/picture-labels/animals \
            -o /tmp/animals_upscaled \
            -n 0 -s 4 -f webp

      - name: Finalize images with Python
        run: |
          python -c "
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter

          SRC = Path('/tmp/animals_upscaled')
          DST = Path('assets/picture-labels/animals')

          for path in sorted(SRC.glob('*.webp')):
              with Image.open(path) as im:
                  im = im.convert('RGBA')
                  bg = Image.new('RGBA', im.size, (255, 255, 255, 255))
                  bg.alpha_composite(im)
                  im = bg.convert('RGB')

                  if im.size != (1024, 1024):
                      im = ImageOps.contain(im, (1024, 1024), Image.Resampling.LANCZOS)
                      canvas = Image.new('RGB', (1024, 1024), (255, 255, 255))
                      x = (1024 - im.width) // 2
                      y = (1024 - im.height) // 2
                      canvas.paste(im, (x, y))
                      im = canvas

                  im = im.filter(ImageFilter.UnsharpMask(radius=0.6, percent=65, threshold=2))
                  out = DST / path.name
                  im.save(out, 'WEBP', quality=95, method=6)
                  print('Saved:', out)
          "

      - name: Verify asset sizes
        run: |
          python -c "
          from pathlib import Path
          from PIL import Image
          root = Path('assets/picture-labels/animals')
          files = sorted(root.glob('*.webp'))
          assert files, 'Файлы не найдены'
          for path in files:
              with Image.open(path) as im:
                  im.load()
                  assert im.size == (1024, 1024), f'{path.name}: wrong size {im.size}'
                  print('OK', path.name, im.size)
          "

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/picture-labels/animals/*.webp
          git diff --staged --quiet || git commit -m "Automated asset rebuild with sharp upscale"
          git push
